name: Build and Deploy Spring Boot to Azure App Service

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build do Frontend (Angular)
        run: |
          cd frontend
          npm install
          npx ng build --configuration=production

      - name: Copiar assets do Angular para o Backend
        run: |
          mkdir -p src/main/resources/static
          cp -r frontend/dist/*/browser/. src/main/resources/static/

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar Backend com Maven
        run: mvn clean package -DskipTests

      - name: Deploy para o Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'fleetwise-ai'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: '**/*.jar'