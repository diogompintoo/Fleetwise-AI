name: Build and Deploy Spring Boot to Azure App Service

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Copiar assets do Frontend para o Backend
        run: |
          mkdir -p src/main/resources/static
          # Substitui 'frontend/dist' pelo caminho exato onde tens a tua pasta dist no repositório
          cp -r frontend/dist/* src/main/resources/static/ 

      - name: Compilar com Maven
        run: mvn clean package -DskipTests

      - name: Deploy para o Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'fleetwise-ai'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: '**/*.jar'