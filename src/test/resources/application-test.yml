spring:
  datasource:
    url: jdbc:h2:mem:fleetwise;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

  sql:
    init:
      mode: never

security:
  jwt:
    secret: test-secret-key-must-be-at-least-32-characters-long
    expiration: 3600000