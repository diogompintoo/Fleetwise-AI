spring:
  datasource:
    url: jdbc:h2:mem:fleetwise;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
  sql:
    init:
      mode: always

server:
  port: 80

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:fleetwiseSecretKeyDefaultForAzureEnvironment2026SecureEnough32Bytes}