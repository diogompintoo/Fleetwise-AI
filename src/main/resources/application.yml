spring:
  application:
    name: fleetwise
  profiles:
    active: local

server:
  port: 8081

ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-1.5-flash
    url: https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/fleetwise
    username: fleetwise
    password: fleetwise
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:fleetwiseai-super-secret-key-256bits-minimum-required-here}
    expiration: 86400000

logging:
  level:
    com.fleetwise: DEBUG
    org.springframework.web: DEBUG     

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:fleetwise;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

server:
  port: ${PORT:8080}

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET}
    expiration: ${SECURITY_JWT_EXPIRATION:86400000}

logging:
  level:
    root: WARN
    com.fleetwise: INFO
    org.springframework.web: WARN
    org.hibernate: WARN