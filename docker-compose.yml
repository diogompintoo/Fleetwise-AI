services:
  postgres:
    image: postgres:16-alpine
    container_name: fleetwise-db
    environment:
      POSTGRES_DB: fleetwise
      POSTGRES_USER: fleetwise
      POSTGRES_PASSWORD: fleetwise
    ports:
      - "5432:5432"
    volumes:
      - fleetwise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetwise -d fleetwise"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fleetwise_pgdata:
